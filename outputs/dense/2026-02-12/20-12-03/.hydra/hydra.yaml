hydra:
  run:
    dir: ./outputs/${stage.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra:job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: InkTrace Training
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: "== ${hydra.help.app_name} ==\n\n使用方法:\n  python train_pl.py stage=<stage_name>\
      \ [overrides...]\n\n可用阶段:\n  - structural: 结构预训练 (遮挡重建)\n  - dense:      密集预测训练\
      \ (多任务学习)\n  - finetune:   端到端微调\n  - debug:      快速调试配置\n\n常用覆盖参数:\n  training.lr=<float>\
      \           学习率\n  training.epochs=<int>         训练轮数\n  training.batch_size=<int>\
      \     批次大小\n  data.num_workers=<int>        DataLoader workers\n\n示例:\n  # 单阶段训练\n\
      \  python train_pl.py stage=structural\n\n  # 带覆盖参数\n  python train_pl.py stage=dense\
      \ training.lr=5e-4 training.epochs=100\n\n  # 多阶段流水线\n  python train_pl.py --multirun\
      \ stage=structural,dense\n\n  # 从 checkpoint 恢复\n  python train_pl.py stage=dense\
      \ training.resume=checkpoints/structural/last.ckpt\n\n  # 迁移学习\n  python train_pl.py\
      \ stage=dense training.init_from=checkpoints/structural/best.ckpt\n"
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - stage=dense
  job:
    name: string
    chdir: null
    override_dirname: ''
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - stage
        - pipeline
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /run/media/fuwaki/Workspace/Workspace/Python/InkTrace
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /run/media/fuwaki/Workspace/Workspace/Python/InkTrace/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /run/media/fuwaki/Workspace/Workspace/Python/InkTrace/outputs/dense/2026-02-12/20-12-03
    choices:
      stage: dense
      override: null
      device: default
      logging: default
      data: default
      training: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
