# @package _global_
# =============================================================================
# Debug: 快速调试配置
# =============================================================================

stage:
  name: debug
  description: "快速调试配置"
  init_from: null
  freeze_encoder: false

# Note: 模型超参数已硬编码在 train_pl.py 中
# - embed_dim: 64, num_layers: 6, num_heads: 6, dropout: 0.1
# - decoder_mid_channels: null, decoder_kernel: 7
# - full_heads: 自动根据 stage 设置 (debug 按 dense 处理=true)
# - mask_ratio: 0.6, mask_strategy: "block"

# training 覆盖
training:
  lr: 1e-3
  epochs: 3
  epoch_length: 320    # 很小，快速迭代
  batch_size: 32
  weight_decay: 1e-4
  grad_clip: 1.0

  scheduler:
    type: onecycle
    warmup_epochs: 3
    pct_start: 0.1

  checkpoint:
    save_dir: checkpoints/debug
    monitor: val/loss
    keep_top_k: 1
    save_last: true
    mode: min

  loss_weights:
    skeleton: 10.0
    keypoints: 7.0
    tangent: 2.0
    width: 1.0
    offset: 1.0

  curriculum:
    enabled: false
    start_stage: 0
    end_stage: 6
    epochs_per_stage: 15

  visualization:
    enabled: true
    num_samples: 2
    log_interval: 1
    log_metrics: true

  init_from: null
  resume: null

# data 覆盖
data:
  img_size: 64
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  rust_threads: 4
  curriculum_stage: 0
  keypoint_sigma: 2.0
